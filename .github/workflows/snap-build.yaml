name: Snap build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to edge
        type: boolean
        default: false

jobs:
  snap:
    uses: sidalit/snap-automation/.github/workflows/snap-build.yaml@v1.3.0
    with:
      build-from: head
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
